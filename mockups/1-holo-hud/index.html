<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noobserver Status · Holo-HUD</title>
  <link rel="icon" type="image/png" href="../../favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <div class="grid-floor" aria-hidden="true"></div>
    <div class="glow-a" aria-hidden="true"></div>
    <div class="glow-b" aria-hidden="true"></div>

    <main class="holo" id="tiltTarget">
      <div class="scanlines" aria-hidden="true"></div>

      <header class="header depth-3">
        <div class="brand">
          <div class="icon-wrap">
            <img id="server-icon" alt="server icon" />
          </div>
          <div class="brand-text">
            <h1>Noobserver</h1>
            <p>Minecraft Survival Server</p>
          </div>
        </div>
        <div class="status-col">
          <div id="status" class="status offline">OFFLINE</div>
          <div id="version" class="version">-</div>
        </div>
      </header>

      <section class="card motd-card depth-1">
        <div class="label">Mensaje del servidor</div>
        <div id="motd"></div>
      </section>

      <div class="stat-row">
        <section class="card depth-2">
          <div class="label">Jugadores</div>
          <div class="value" id="players-count">0 / 20</div>
          <div class="bar"><div id="players-bar"></div></div>
        </section>

        <section class="card depth-2">
          <div class="label">Ping</div>
          <div class="value" id="ping-value">-- ms</div>
          <div class="ping-status-container">
            <div class="ping-bar">
              <div class="ping-bar-segment excellent"></div>
              <div class="ping-bar-segment good"></div>
              <div class="ping-bar-segment acceptable"></div>
              <div class="ping-bar-segment bad"></div>
              <div class="ping-bar-segment terrible"></div>
            </div>
            <div id="ping-arrow" class="ping-arrow">▼</div>
          </div>
          <div id="ping-status-text" class="ping-status-text">Estado de tu conexión: -</div>
        </section>
      </div>

      <section class="card players depth-1">
        <div class="label">Jugadores conectados</div>
        <div id="players-list" class="players-list">
          <div class="empty">Sin jugadores conectados</div>
        </div>
      </section>

      <footer class="depth-1">
        <div>Última actualización: <span id="last-update">--</span></div>
      </footer>
    </main>
  </div>

  <!-- Lógica original SIN modificar -->
  <script src="config.js"></script>
  <script src="script.js"></script>

  <!-- Parallax 3D del panel (solo efecto visual, no toca los datos) -->
  <script>
    (function () {
      var target = document.getElementById("tiltTarget");
      var scene = document.querySelector(".scene");
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var coarse = window.matchMedia("(pointer: coarse)").matches;
      if (!target || reduce || coarse) return;

      var rx = 0, ry = 0, tx = 0, ty = 0;
      window.addEventListener("mousemove", function (e) {
        var w = window.innerWidth, h = window.innerHeight;
        tx = (e.clientX / w - 0.5);
        ty = (e.clientY / h - 0.5);
      });
      (function loop() {
        rx += (ty * -10 - rx) * 0.08;
        ry += (tx * 14 - ry) * 0.08;
        target.style.transform =
          "rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
        scene.style.setProperty("--px", (tx * 22).toFixed(1) + "px");
        scene.style.setProperty("--py", (ty * 22).toFixed(1) + "px");
        requestAnimationFrame(loop);
      })();
    })();
  </script>
</body>
</html>
