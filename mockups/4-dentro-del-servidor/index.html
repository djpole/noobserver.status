<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noobserver Status</title>
  <link rel="icon" type="image/png" href="../../favicon.png" />
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="viewer" id="viewer">
    <div class="hero" id="hero" aria-hidden="true"></div>
    <div class="haze" aria-hidden="true"></div>
    <div class="dust" id="dust" aria-hidden="true"></div>
    <div class="ripples" id="ripples" aria-hidden="true"></div>
    <div class="fx" id="fx" aria-hidden="true"></div>

    <div class="scene3d" id="scene3d">
      <div class="plate title-plate">
        <div class="icon-wrap"><img id="server-icon" alt="server icon" /></div>
        <div class="title-text">
          <h1>Noobserver</h1>
          <p>Minecraft Survival Server</p>
        </div>
        <div class="title-status">
          <div id="status" class="status offline">OFFLINE</div>
          <div id="version" class="version">-</div>
        </div>
      </div>

      <div class="col col-left">
        <section class="plate card">
          <div class="label">Mensaje del servidor</div>
          <div id="motd"></div>
        </section>
        <section class="plate card">
          <div class="label">Ping</div>
          <div class="value" id="ping-value">-- ms</div>
          <div class="ping-status-container">
            <div class="ping-bar">
              <div class="ping-bar-segment excellent"></div>
              <div class="ping-bar-segment good"></div>
              <div class="ping-bar-segment acceptable"></div>
              <div class="ping-bar-segment bad"></div>
              <div class="ping-bar-segment terrible"></div>
            </div>
            <div id="ping-arrow" class="ping-arrow">▼</div>
          </div>
          <div id="ping-status-text" class="ping-status-text">Estado de tu conexión: -</div>
        </section>
      </div>

      <div class="col col-right">
        <section class="plate card players-card">
          <div class="label">Jugadores conectados</div>
          <div class="value" id="players-count">0 / 20</div>
          <div class="bar"><div id="players-bar"></div></div>
          <div id="players-list" class="players-list">
            <div class="empty">Sin jugadores conectados</div>
          </div>
        </section>
      </div>
    </div>

    <footer class="foot">Última actualización: <span id="last-update">--</span></footer>
    <div class="hint" id="hint">Mueve el ratón para mirar alrededor</div>
  </div>

  <!-- Foto del portal incrustada en un data URI -->
  <script src="pano/faces.js?v=1"></script>
  <script src="scene.js?v=1"></script>

  <!-- Lógica original del panel (no modificar) -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
